name: Deploy Frontend to EC2

on:
  push:
    branches:
      - test  # Se ejecutará cuando haya un push en la rama test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Clonar Repositorio
      uses: actions/checkout@v3

    - name: 🔑 Configurar Acceso SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY_FRONT }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST_FRONT }} >> ~/.ssh/known_hosts

    - name: 📡 Conectar y Desplegar el Frontend en EC2
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_FRONT }} << 'EOF'
          echo "✅ Conexión a EC2 exitosa. Iniciando despliegue..."
          
          # Navegar al proyecto
          cd /home/ubuntu/frontend-app/front-distribuida/login-app || exit 1
          
          # Limpiar cambios locales y actualizar código
          git fetch origin test
          git reset --hard origin/test
          
          # Verificar si hay cambios
          if ! git diff --quiet HEAD; then
            echo "🚀 Se detectaron cambios. Actualizando..."
          
            # Instalar dependencias y reiniciar aplicación
            npm install
            pm2 restart frontend || pm2 start npm --name frontend -- start -- --host 0.0.0.0
          else
            echo "✅ No hay cambios en el código. No es necesario reiniciar."
          fi

          echo "🚀 Despliegue completado exitosamente en /frontend-app/front-distribuida/login-app."
        EOF
